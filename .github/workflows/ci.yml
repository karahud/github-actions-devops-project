
name: DevOps Multi-Job CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  validate:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f website/index.html

      - name: Validate website content
        run: |
          grep -q "Welcome to My DevOps Portal!" website/index.html
          echo "Website validation successful!"

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website/

  security:
    name: Basic Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check for private key files
        run: |
          if find . -type f \( -name "id_rsa" -o -name "id_ed25519" \) | grep -q .; then
            echo "Private key file detected!"
            exit 1
          else
            echo "No matching private key files found."
          fi

  deploy:
    name: Deployment Preparation
    needs: [validate, security]
    runs-on: ubuntu-latest

    steps:
      - name: Deployment ready
        run: echo "All checks passed. Ready for deployment!"

